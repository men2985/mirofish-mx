# Frontend compilado + proxy al backend Flask (fork MX).
# El login lo pone Traefik delante (forwardAuth); aquí todo es mismo dominio, sin CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: el backend se resuelve en cada petición, así nginx arranca aunque el backend aún no exista
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://mirofish:5001;

    client_max_body_size 60m;          # subida de semillas (MiroFish acepta 50 MB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre: caché larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Publicaciones públicas: página renderizada por el backend (lleva las etiquetas de vista previa de WhatsApp)
    location /p/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # Librería 3D para la página pública (copiada del paquete en el build)
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API y salud del backend
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_buffering off;           # streams de logs del informe
        proxy_read_timeout 900s;       # ontología, informe, ilustración y entrevistas tardan minutos
        proxy_send_timeout 900s;
    }
    location = /health { proxy_pass $backend; }

    # SPA: cualquier otra ruta devuelve index.html (sin caché, para tomar el build nuevo al desplegar)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
